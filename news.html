<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birhanu Moges | Data Scientist Portfolio</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Typed.js -->
    <script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>
    
    <style>
        /* ========== CSS VARIABLES ========== */
        :root {
            --primary-color: #fa5b0f;
            --primary-dark: #e04e0c;
            --primary-light: #fb732f;
            --secondary-color: #f59e0b;
            --accent-color: #f97316;
            --bg-dark: #0f172a;
            --bg-darker: #020617;
            --bg-light: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: #334155;
            --card-bg: rgba(30, 41, 59, 0.8);
            --sidebar-bg: rgba(15, 23, 42, 0.95);
            --gradient-primary: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);
            --space-xs: 0.5rem;
            --space-sm: 0.75rem;
            --space-md: 1rem;
            --space-lg: 1.5rem;
            --space-xl: 2rem;
            --space-2xl: 3rem;
            --radius-sm: 0.375rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --radius-xl: 1rem;
            --radius-full: 9999px;
            --font-primary: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --sidebar-width: 300px;
            --transition-fast: 0.2s ease;
            --transition-normal: 0.3s ease;
        }

        /* Light Theme */
        body.light-theme {
            --bg-dark: #ffffff;
            --bg-darker: #f8fafc;
            --bg-light: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --border-color: #e2e8f0;
            --card-bg: #ffffff;
            --sidebar-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-primary);
            background-color: var(--bg-darker);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            transition: all var(--transition-normal);
        }

        ::selection {
            background-color: var(--primary-color);
            color: white;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--border-color);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            border-radius: var(--radius-full);
        }

        /* Layout */
        .portfolio-container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--sidebar-bg);
            backdrop-filter: blur(10px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: var(--space-xl);
            overflow-y: auto;
            z-index: 100;
            transition: all var(--transition-normal);
        }

        .profile-section {
            text-align: center;
            margin-bottom: var(--space-xl);
            padding-bottom: var(--space-xl);
            border-bottom: 1px solid var(--border-color);
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto var(--space-lg);
            border: 4px solid transparent;
            background: var(--gradient-primary);
            background-clip: padding-box;
            transition: transform var(--transition-normal);
        }

        .profile-img:hover {
            transform: scale(1.05);
        }

        .profile-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: var(--space-xs);
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .profile-role {
            color: var(--primary-color);
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* Navigation */
        .main-nav ul {
            list-style: none;
        }

        .main-nav li {
            margin-bottom: var(--space-sm);
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: var(--space-md);
            padding: var(--space-sm) var(--space-md);
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: var(--radius-md);
            transition: all var(--transition-fast);
        }

        .nav-link i {
            width: 24px;
        }

        .nav-link:hover {
            background: rgba(250, 91, 15, 0.1);
            color: var(--primary-color);
            transform: translateX(5px);
        }

        .nav-link.active {
            background: var(--gradient-primary);
            color: white;
        }

        /* Social Links */
        .social-section {
            margin-top: auto;
            padding-top: var(--space-xl);
            border-top: 1px solid var(--border-color);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: var(--space-md);
        }

        .social-links a {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--card-bg);
            border-radius: 50%;
            color: var(--text-secondary);
            transition: all var(--transition-fast);
        }

        .social-links a:hover {
            background: var(--gradient-primary);
            color: white;
            transform: translateY(-3px);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: var(--space-2xl);
            min-height: 100vh;
        }

        /* Section Styles */
        .section {
            margin-bottom: var(--space-2xl);
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-header {
            text-align: center;
            margin-bottom: var(--space-2xl);
        }

        .section-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: var(--space-sm);
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .section-line {
            width: 60px;
            height: 4px;
            background: var(--gradient-primary);
            margin: 0 auto var(--space-md);
            border-radius: var(--radius-full);
        }

        .section-subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        /* Hero Section */
        .hero-section {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .hero-badge {
            display: inline-block;
            padding: var(--space-xs) var(--space-md);
            background: rgba(250, 91, 15, 0.1);
            border-radius: var(--radius-full);
            color: var(--primary-color);
            font-size: 0.85rem;
            margin-bottom: var(--space-lg);
        }

        .hero-title {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: var(--space-md);
        }

        .hero-title .highlight {
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-typed {
            font-size: 1.8rem;
            margin-bottom: var(--space-xl);
        }

        .typed-text {
            color: var(--primary-color);
            font-weight: 600;
        }

        .hero-description {
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin-bottom: var(--space-xl);
            line-height: 1.8;
        }

        .hero-buttons {
            display: flex;
            gap: var(--space-md);
            flex-wrap: wrap;
            margin-bottom: var(--space-2xl);
        }

        .hero-stats {
            display: flex;
            gap: var(--space-2xl);
            margin-top: var(--space-xl);
        }

        .hero-stat {
            text-align: center;
        }

        .hero-stat .stat-number {
            display: block;
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .hero-stat .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-sm);
            padding: 12px 28px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-fast);
            border: 2px solid transparent;
            text-decoration: none;
            font-family: var(--font-primary);
        }

        .btn-primary {
            background: var(--gradient-primary);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
        }

        .btn-outline {
            background: transparent;
            color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .btn-outline:hover {
            background: var(--gradient-primary);
            color: white;
            transform: translateY(-3px);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        .btn-secondary:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .btn-small {
            padding: 8px 20px;
            font-size: 0.85rem;
        }

        /* About Section */
        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-2xl);
        }

        .about-text p {
            color: var(--text-secondary);
            margin-bottom: var(--space-lg);
            line-height: 1.8;
        }

        .about-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--space-md);
            margin: var(--space-xl) 0;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .info-item i {
            color: var(--primary-color);
            width: 20px;
        }

        .about-stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--space-lg);
        }

        .stat-card {
            background: var(--card-bg);
            padding: var(--space-lg);
            border-radius: var(--radius-lg);
            text-align: center;
            border: 1px solid var(--border-color);
            transition: all var(--transition-fast);
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
        }

        .stat-icon {
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: var(--space-sm);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: var(--space-xs);
        }

        .stat-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Project Filters */
        .project-filters {
            display: flex;
            justify-content: center;
            gap: var(--space-md);
            margin-bottom: var(--space-2xl);
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: var(--space-sm) var(--space-xl);
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-full);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--gradient-primary);
            color: white;
            border-color: transparent;
        }

        /* Projects Grid */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: var(--space-xl);
        }

        .project-card {
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: all var(--transition-normal);
        }

        .project-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary-color);
            box-shadow: var(--shadow-xl);
        }

        .project-image {
            height: 220px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .project-image i {
            font-size: 4rem;
            color: white;
            opacity: 0.8;
        }

        .project-content {
            padding: var(--space-lg);
        }

        .project-badge {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(250, 91, 15, 0.1);
            border-radius: var(--radius-full);
            color: var(--primary-color);
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: var(--space-sm);
        }

        .project-content h3 {
            font-size: 1.25rem;
            margin-bottom: var(--space-sm);
        }

        .project-content p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: var(--space-md);
            line-height: 1.6;
        }

        .project-tech {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-xs);
            margin-bottom: var(--space-md);
        }

        .project-tech span {
            padding: 4px 10px;
            background: var(--bg-light);
            border-radius: var(--radius-full);
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .project-links {
            display: flex;
            gap: var(--space-sm);
        }

        /* Skills Section */
        .skills-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: var(--space-xl);
        }

        .skill-category {
            background: var(--card-bg);
            padding: var(--space-xl);
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-color);
            transition: all var(--transition-fast);
        }

        .skill-category:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
        }

        .skill-category h3 {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            margin-bottom: var(--space-lg);
            font-size: 1.2rem;
        }

        .skill-category h3 i {
            color: var(--primary-color);
        }

        .skill-item {
            margin-bottom: var(--space-lg);
        }

        .skill-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: var(--space-xs);
            font-size: 0.9rem;
        }

        .progress-bar {
            height: 8px;
            background: var(--border-color);
            border-radius: var(--radius-full);
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: var(--gradient-primary);
            border-radius: var(--radius-full);
            width: 0;
            transition: width 1s ease;
        }

        /* Services Grid */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: var(--space-xl);
        }

        .service-card {
            background: var(--card-bg);
            padding: var(--space-xl);
            border-radius: var(--radius-xl);
            text-align: center;
            border: 1px solid var(--border-color);
            transition: all var(--transition-normal);
        }

        .service-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary-color);
            box-shadow: var(--shadow-xl);
        }

        .service-icon {
            width: 70px;
            height: 70px;
            background: var(--gradient-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto var(--space-lg);
        }

        .service-icon i {
            font-size: 2rem;
            color: white;
        }

        .service-card h3 {
            font-size: 1.3rem;
            margin-bottom: var(--space-sm);
        }

        .service-card p {
            color: var(--text-secondary);
            margin-bottom: var(--space-lg);
            line-height: 1.6;
        }

        .service-features {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: var(--space-xs);
        }

        .service-features span {
            padding: 4px 10px;
            background: rgba(250, 91, 15, 0.1);
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            color: var(--primary-color);
        }

        /* Contact Section */
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: var(--space-2xl);
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: var(--space-lg);
        }

        .contact-card {
            background: var(--card-bg);
            padding: var(--space-xl);
            border-radius: var(--radius-xl);
            text-align: center;
            border: 1px solid var(--border-color);
            transition: all var(--transition-fast);
        }

        .contact-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
        }

        .contact-icon {
            width: 30px;
            height: 30px;
            background: var(--gradient-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto var(--space-md);
        }

        .contact-icon i {
            font-size: 1.5rem;
            color: white;
        }

        .contact-card h3 {
            margin-bottom: var(--space-xs);
        }

        .contact-card p {
            color: var(--text-secondary);
        }

        .contact-form-wrapper {
            background: var(--card-bg);
            padding: var(--space-xl);
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-color);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-md);
            margin-bottom: var(--space-md);
        }

        .form-group {
            margin-bottom: var(--space-md);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: var(--space-md);
            background: var(--bg-light);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: var(--font-primary);
            transition: all var(--transition-fast);
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .btn-block {
            width: 100%;
        }

        /* Footer */
        .main-footer {
            margin-top: var(--space-2xl);
            padding-top: var(--space-xl);
            border-top: 1px solid var(--border-color);
            text-align: center;
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--space-md);
        }

        .footer-social {
            display: flex;
            gap: var(--space-md);
        }

        .footer-social a {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--card-bg);
            border-radius: 50%;
            color: var(--text-secondary);
            transition: all var(--transition-fast);
        }

        .footer-social a:hover {
            background: var(--gradient-primary);
            color: white;
        }

        /* Sidebar Footer */
        .sidebar-footer {
            margin-top: auto;
            padding-top: var(--space-lg);
            border-top: 1px solid var(--border-color);
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Footer text spacing */
        .sidebar-footer p {
            margin-bottom: 6px;
        }

        /* Visitor counter style */
        .visitor-count {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* Eye icon */
        .visitor-count i {
            color: var(--primary-color);
        }

        /* Back to Top */
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: var(--gradient-primary);
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all var(--transition-fast);
            z-index: 100;
        }

        .back-to-top.visible {
            display: flex;
            animation: bounceIn 0.5s ease;
        }

        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.3); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Style Switcher */
        .style-switcher {
            position: fixed;
            top: 100px;
            right: 0;
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius-lg) 0 0 var(--radius-lg);
            border: 1px solid var(--border-color);
            border-right: none;
            z-index: 100;
            transform: translateX(100%);
            transition: transform var(--transition-normal);
            width: 220px;
        }

        .style-switcher.open {
            transform: translateX(0);
        }

        .style-switcher-toggler,
        .theme-toggler {
            position: absolute;
            width: 45px;
            height: 45px;
            background: var(--card-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid var(--border-color);
        }

        .style-switcher-toggler {
            left: -45px;
            top: 0;
        }

        .theme-toggler {
            right: -45px;
            top: 0;
        }

        .colors {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .colors span {
